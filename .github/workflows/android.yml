name: Build APK
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin' }
    - name: Setup Gradle (Force 8.5)
      uses: gradle/actions/setup-gradle@v3
      with: { gradle-version: '8.5' }
    - name: Decode keystore
      if: ${{ env.KEYSTORE_BASE64 != '' }}
      env: { KEYSTORE_BASE64: '${{ secrets.KEYSTORE_BASE64 }}' }
      run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
    - name: Build debug APK
      run: gradle assembleDebug --no-daemon
    - name: Report signing
      env:
        KEYSTORE_SET: ${{ secrets.KEYSTORE_BASE64 != '' }}
      run: |
        if [ "$KEYSTORE_SET" = "true" ]; then
          echo "Signing: your release keystore"
        else
          echo "Signing: debug key (add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD to enable release signing)"
        fi
    - name: Build release APK
      env:
        KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: gradle assembleRelease --no-daemon
    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with: { name: penkhata-apk-debug, path: app/build/outputs/apk/debug/app-debug.apk }
    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with: { name: penkhata-apk, path: app/build/outputs/apk/release/app-release.apk }
